<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LinkedIn Job Capture</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --card-border: rgba(255, 255, 255, 0.1);
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --success: #10b981;
      --error: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      width: 320px;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      padding: 16px;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--card-border);
      margin-bottom: 12px;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .icon-badge {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      background: linear-gradient(135deg, #6366f1, #a855f7);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
    }

    .title {
      font-size: 14px;
      font-weight: 700;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--card-border);
    }

    .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #94a3b8;
    }

    .dot.online {
      background: var(--success);
      box-shadow: 0 0 6px var(--success);
    }

    .dot.offline {
      background: var(--error);
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 12px;
    }

    .job-info-title {
      font-size: 13px;
      font-weight: 600;
      color: #ffffff;
      margin-bottom: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .job-info-company {
      font-size: 12px;
      color: var(--text-muted);
      margin-bottom: 10px;
    }

    .btn {
      width: 100%;
      padding: 9px 12px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      border: none;
      transition: all 0.2s;
    }

    .btn-primary {
      background: var(--primary);
      color: #ffffff;
    }

    .btn-primary:hover {
      background: var(--primary-hover);
    }

    .btn-disabled {
      opacity: 0.5;
      cursor: not-allowed;
      background: #334155;
      color: #94a3b8;
    }

    .footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 12px;
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px solid var(--card-border);
    }

    .footer a {
      color: #a5b4fc;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .footer a:hover {
      text-decoration: underline;
      color: #ffffff;
    }

    .msg-box {
      font-size: 12px;
      padding: 8px 10px;
      border-radius: 6px;
      margin-bottom: 10px;
      display: none;
    }

    .msg-warning {
      background: rgba(245, 158, 11, 0.15);
    .btn-secondary {
      background: #334155;
      color: #f8fafc;
      border: 1px solid rgba(255, 255, 255, 0.15);
      margin-top: 8px;
    }

    .btn-secondary:hover {
      background: #475569;
    }

    .badge-tag {
      display: inline-block;
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: 600;
      margin-bottom: 6px;
    }

    .badge-verified {
      background: rgba(99, 102, 241, 0.2);
      color: #a5b4fc;
      border: 1px solid rgba(99, 102, 241, 0.4);
    }

    .badge-unverified {
      background: rgba(245, 158, 11, 0.2);
      color: #fbbf24;
      border: 1px solid rgba(245, 158, 11, 0.4);
    }

    .hint-text {
      font-size: 11px;
      color: #94a3b8;
      margin-top: 6px;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="header-left">
      <div class="icon-badge">🤖</div>
      <span class="title">Job Agent</span>
    </div>
    <div class="status-badge" id="statusBadge">
      <span class="dot" id="statusDot"></span>
      <span id="statusText">Checking...</span>
    </div>
  </div>

  <div id="warningBox" class="msg-box"></div>

  <div class="card" id="jobCard">
    <div id="modeBadge" class="badge-tag badge-unverified">LinkedIn Page</div>
    <div class="job-info-title" id="pageTitle">Detecting page...</div>
    <div class="job-info-company" id="pageCompany">Checking LinkedIn active tab</div>

    <!-- Verified Job Action (only on /jobs/view/*) -->
    <div id="verifiedActionArea" style="display: none; margin-bottom: 8px;">
      <button class="btn btn-primary" id="captureBtn">
        ✨ Capture Verified Job
      </button>
      <div class="hint-text">Auto-matches against active resume with evidence coverage.</div>
    </div>

    <!-- Quick Capture Action (available on all linkedin.com pages) -->
    <div id="quickCaptureArea">
      <button class="btn btn-secondary" id="quickCaptureBtn">
        📝 Quick Capture (Manual Review)
      </button>
      <div class="hint-text" id="quickCaptureHint">
        Stages raw text for review in dashboard. <strong>Will NOT auto-match</strong> until you review and submit it.
      </div>
    </div>
  </div>

  <div class="footer">
    <a href="#" id="openDashboard">Open Job Agent ↗</a>
    <a href="#" id="openOptions">Settings ⚙</a>
  </div>

  <script src="popup.js"></script>
</body>
</html>
